[package]
name = "membrane_vm"
version = "0.1.0"
edition = "2021"
description = "membrane's cliffhanger VM, native (#971)"
license = "MIT"
publish = false

[lib]
name = "membrane_vm"
crate-type = ["cdylib", "rlib"]

# THE ONE PLACE THE COMMAND'S NAME LIVES (docs/cliffvm.md): rename the app by changing `name` here (the tests read CARGO_BIN_EXE_<name>: one more line each)
[[bin]]
name = "cliffvm"
path = "src/bin/cliffvm.rs"
required-features = ["bin"]

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
pollster = { version = "1.0.1", optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
# the tokenizer (#1143): UAX #29 sentence and word boundaries, compiled in; no_std-capable, so wasm32 builds
unicode-segmentation = { version = "=1.13.3", default-features = false }
# the field store (#1111): the process's one SQLite, owned by the native engine
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
wgpu = { version = "30.0.1", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[features]
default = ["python"]
store = ["dep:rusqlite", "tls"]   # the native field store + the drivers + the door (one SQLite per process, #1111); no Python
python = ["dep:pyo3", "store"]   # the seat: Python binding on top of the store
bin = ["store"]   # the standalone app (`[[bin]]` below): the same engine with no Python at all (build it with --no-default-features --features bin: a Python extension is not a program)
wasm = ["dep:wasm-bindgen"]
metal = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
tls = ["dep:rustls", "dep:webpki-roots"]   # https for the Fetch driver (rustls + webpki roots); off for wasm

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# the Rust tests' own executor (a test binary is its own process: it never shares a WAL file with the seat)
rusqlite = { version = "0.32", features = ["bundled"] }
