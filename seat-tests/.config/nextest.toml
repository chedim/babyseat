# nextest runs every test at once across the binaries (.github/workflows/validate.yml). A test that MEASURES the machine (the CPU time an idle seat uses) cannot share it: it takes every slot, so nothing else runs
# while it does. Only tests that measure CPU time belong here; tests with a wall-clock bound have so far passed alongside the rest.
[[profile.default.overrides]]
filter = 'binary(idle_churn_1143)'
threads-required = 'num-cpus'
