# THE LAST membrane-seat (#303): the project is babyseat now. This
# distribution depends on babyseat at exactly its own version, so
# `pip install -U membrane-seat` (and the 0.6 seats' own updater) moves an
# install over. The publish lane builds it next to babyseat and refuses a tag
# where its version is not pyproject.toml's (tests/test_brand_303.py guards it).
#
# WHY IT CARRIES THE MODULE: pip installs babyseat first, then uninstalls the
# old membrane-seat -- whose RECORD lists membrane/* and bin/membrane, the very
# files babyseat just wrote. An empty shim leaves an install with no module and
# no `membrane` command. So this one ships the same module (the publish lane
# copies ../../membrane in before building; never committed, see .gitignore)
# and the `membrane` script, and the upgrade ends with both in place.
# Build by hand: cp -R membrane shim/membrane-seat/membrane &&
#   python -m build shim/membrane-seat --outdir dist
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-seat"
version = "0.7.0"
description = "membrane-seat is now babyseat: installing it installs babyseat."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrii Chechetkin" }]
dependencies = ["babyseat==0.7.0"]

[project.urls]
Homepage = "https://github.com/chedim/membrane"

[project.scripts]
membrane = "membrane.cli:main"

[tool.setuptools]
packages = ["membrane"]

[tool.setuptools.package-data]
membrane = ["skills/*/SKILL.md", "skills/*/*.md", "viewer.html", "three.min.js", "*.woff2",
            "ui/*.html", "ui/*.js", "ui/*.mjs", "ui/*.svg"]
