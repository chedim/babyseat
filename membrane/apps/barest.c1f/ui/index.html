<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membrane seat</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="ui/www/app.css">
</head>
<body>
<header class="bar">
  <h1>Membrane seat</h1>
  <span id="conn" class="conn" role="status" aria-live="polite">connecting</span>
</header>
<main class="panes">
  <section class="pane graph" aria-label="Graph viewer">
    <div class="tools">
      <input id="filter" type="search" placeholder="Filter by entity id" aria-label="Filter entities by id substring" autocomplete="off">
      <label class="check"><input id="showreq" type="checkbox"> requests</label>
      <button id="refresh" type="button" title="Read the field again">Refresh</button>
      <button id="zoomin" type="button" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoomout" type="button" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="fit" type="button" title="Fit the graph to the view">Fit</button>
      <button id="listbtn" type="button" aria-pressed="false" title="Show the entities as a list">List</button>
      <span id="count" class="count" aria-live="polite"></span>
    </div>
    <div class="stage">
      <canvas id="canvas" tabindex="0" aria-label="Entity graph. Drag to move, wheel to zoom, arrow keys to pan, plus and minus to zoom."></canvas>
      <ul id="list" class="list" hidden></ul>
      <aside id="side" class="side" hidden aria-label="Entity properties">
        <header><strong id="side-eid"></strong> <span id="side-cls" class="cls"></span><button id="side-close" type="button" aria-label="Close">x</button></header>
        <div id="side-links" class="links"></div>
        <dl id="side-props"></dl>
      </aside>
      <p id="empty" class="empty" hidden>The field fills as the seat works. Say something in the chat and watch it grow here.</p>
    </div>
    <div id="legend" class="legend" aria-label="Classes"></div>
  </section>
  <section class="pane chat" aria-label="Chat">
    <ol id="log" class="log" aria-live="polite"></ol>
    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="2" placeholder="Tell the seat what you are working on. Enter sends, Shift+Enter adds a line." aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script type="module" src="ui/www/app.js"></script>
</body>
</html>
