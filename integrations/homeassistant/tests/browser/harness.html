<!doctype html><html><head><meta charset="utf-8"><title>membrane home voice harness</title></head>
<body style="margin:0;background:#111;color:#ddd">
<script>
  // a stub hass: enough for membrane home to render and run its voice; the
  // field and the chat fail quietly (no seat behind this page)
  window.__said = [];
  // silent: headless Chrome on a Mac speaks through the real speakers (the
  // operator heard the tests' "uh-huh"s) -- speech is recorded, never played
  window.__spoken = [];
  if (window.speechSynthesis) {
    window.speechSynthesis.speak = (u) => { window.__spoken.push(u.text); setTimeout(() => u.onend && u.onend(), 10); };
    window.speechSynthesis.cancel = () => {};
  }
  HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
  // the microphone: the test's WAV, looped -- the same in Chrome and Firefox
  // (Firefox can't take a file as its fake device)
  if (navigator.mediaDevices) {
    navigator.mediaDevices.getUserMedia = async () => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = await ctx.decodeAudioData(await (await fetch("/fixture.wav")).arrayBuffer());
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const dst = ctx.createMediaStreamDestination(); src.connect(dst); src.start();
      return dst.stream;
    };
  }
  window.fakeHass = { user: { id: "u-test", name: "Test User", is_admin: true }, states: {}, panels: {}, language: "en",
    fetchWithAuth: async () => new Response("{}", { status: 404 }), callApi: async () => { throw new Error("no api"); },
    callWS: async () => ({}), connection: { subscribeEvents: async () => () => {} } };
</script>
<script type="module">
  // a custom seat name (standalone mode): ?name=Juniper, set before the UI loads
  const nm = new URLSearchParams(location.search).get("name");
  if (nm) window.MEMBRANE_NAME = nm;
  await import("/api/ai_terminal/www/panel.js");
  await import("/api/ai_terminal/www/home.js");
  const el = document.createElement("membrane-home-panel");
  document.body.appendChild(el);
  el.hass = window.fakeHass;
  el._sendToChat = (t) => window.__said.push(t);       // what the voice would send (the old path)
  // the voice's own path (voice:in, 2026-10-11): the chat panel's sendVoice
  const chatPanel = () => el.shadowRoot && el.shadowRoot.querySelector("ai-terminal-panel");
  const hook = () => { const c = chatPanel(); if (c) c.sendVoice = async (t) => { window.__said.push(t); }; else setTimeout(hook, 50); };
  hook();
  window.__home = el;
  window.__ready = true;
</script>
</body></html>
