# The babyseat add-on (#1143): the seat `cliffvm serve` run by the Supervisor on Home Assistant OS and Supervised installs. The keys are those of
# https://contributors.home-assistant.io/apps/reference/configuration/ (the Supervisor IGNORES an unknown key: tests/wrapper/test_ha_addon.py refuses one).
name: "babyseat"
version: "0.7.60"
slug: "babyseat"
description: "The babyseat AI seat (a memory graph the model programs), announced to the babyseat (membrane) integration"
url: "https://github.com/chedim/membrane/tree/main/addon"
arch:
  - aarch64
  - amd64
# no `startup`/`boot`: their defaults (application, auto) are meant, and the linter refuses a key set to its default
# no `image`: the Supervisor builds the Dockerfile on the device, which downloads this version's release tarball (checked against its sha256)
# init stays true (the default): the ENTRYPOINT is run.sh, not the base image's s6 /init, so Docker's init forwards the stop signal to the seat
# the Home Assistant config folder, read-only, at /config: the seat's history cutover finds the 0.7 store at /config/membrane/.membrane by itself
map:
  - type: homeassistant_config
    path: /config
# the Supervisor discovery the add-on sends at every start (announce.sh): the integration's `hassio` config-flow step receives {host, port, token}
discovery:
  - membrane
ports:
  4096/tcp: 4096
ports_description:
  4096/tcp: "The seat's door and page (every route but the page needs a token)"
webui: "http://[HOST]:[PORT:4096]/"
# no `watchdog`: the add-on linter (frenck/action-app-linter) refuses it as obsolete in favour of the image's Docker HEALTHCHECK (addon/Dockerfile)
options:
  provider: anthropic
  model: "claude-sonnet-5-5"
  ollama_url: "http://homeassistant.local:11434"
schema:
  seat_name: "str?"
  provider: "list(anthropic|openai|ollama|claude_cli)"
  model: "str?"
  base_url: "url?"
  api_key: "password?"
  ollama_url: "url?"
  claude_path: "str?"
  anthropic_api_key: "password?"
