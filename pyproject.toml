[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane"
version = "0.1.0"
description = "A local-first memory field for coding agents: RAG + learning gate + thermodynamics, served through an OpenAI-compatible proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitrii Chechetkin" }]
dependencies = ["numpy>=1.26"]

[project.scripts]
membrane = "membrane.cli:main"

[tool.setuptools]
packages = ["membrane"]

[tool.setuptools.package-data]
membrane = ["skills/*/SKILL.md"]