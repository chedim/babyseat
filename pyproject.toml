[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babyseat"
version = "0.7.4"
description = "babyseat (formerly membrane): a local-first seat for AI with a memory field (membrane) -- its own web UI (`babyseat`) or inside Home Assistant (HACS)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrii Chechetkin" }]
dependencies = ["numpy>=1.26",
                # the code tree's grammars (#622): code is parsed into nodes in the field
                "tree-sitter>=0.25", "tree-sitter-bash>=0.25", "tree-sitter-javascript>=0.25",
                "tree-sitter-python>=0.25"]

[project.optional-dependencies]
couchbase = ["couchbase>=4.6"]      # a Couchbase cluster for the field / peers; the default stores need none
mdns = ["zeroconf"]                 # peers found on the LAN
claude-agent = ["claude-agent-sdk"]  # Claude via the Agent SDK on the anthropic API key (#384, #413); membrane's tools only (#389)
rerank = ["sentence-transformers"]  # the recall reranker (#680): bge-reranker-v2-m3 over the banner's top 20; torch, ~3.3 GB GPU memory loaded
nlp = ["spacy>=3.8.18", "lemminflect"]             # living language (language.py); on by default: the seat installs spaCy and en_core_web_sm itself at boot

[project.urls]
Homepage = "https://github.com/chedim/membrane"
Issues = "https://github.com/chedim/membrane/issues"

[project.scripts]
membrane = "membrane.cli:main"
babyseat = "membrane.cli:babyseat_main"   # #303: the brand's door = `membrane standalone`

[tool.setuptools]
packages = ["membrane"]

[tool.pytest.ini_options]
# The seat's own suite. The homeassistant INTEGRATION's tests
# (integrations/homeassistant/tests) are a separate suite with its own
# conftest -- one that installs fake `homeassistant` and `aiohttp` packages
# at import time; collected together the two conftests poison each other's
# sys.modules (the CI exhibits: `cannot import name 'Event'`,
# `No module named 'homeassistant.auth'`, a fake aiohttp under the
# detached-seat tests). Give the root run tests/ only; the integration
# tree runs as its own pytest process (its own CI step, its own box).
testpaths = ["tests"]
markers = [
    "live_lane: boots real seats and runs REAL model turns through the operator's local ollama",
]

[tool.setuptools.package-data]
membrane = ["skills/*/SKILL.md", "skills/*/*.md", "viewer.html", "three.min.js", "*.woff2",
            "ui/*.html", "ui/*.js", "ui/*.mjs", "ui/*.svg"]