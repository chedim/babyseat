[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babyseat"
version = "0.7.53"
description = "babyseat (formerly membrane): a local-first seat for AI with a memory field (membrane) -- its own web UI (`babyseat`) or inside Home Assistant (HACS)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrii Chechetkin" }]
# the seat is the `cliffvm` binary the wheel carries (native/, Rust); Python is only the launcher (membrane/launcher.py)
dependencies = []

[project.urls]
Homepage = "https://github.com/chedim/membrane"
Issues = "https://github.com/chedim/membrane/issues"

[project.scripts]
membrane = "membrane.launcher:main"
babyseat = "membrane.launcher:main"

[tool.setuptools]
packages = ["membrane"]

[tool.pytest.ini_options]
# the Home Assistant component's tests (fake HA, fake seat, a real cliffvm when built: CLIFFVM_BIN) and the wrapper's
testpaths = ["tests/ha", "tests/wrapper"]

# TODO(packaging, docs/python-retirement.md step 9): the wheel must carry the binary and the data as `membrane/dist/{bin/cliffvm,packs,apps,ui,help}`
# (setup.py builds `native/` with setuptools-rust Binding.Exec and tags the wheel py3-none-<platform>); until then the data folders below
# ship from the source tree and the launcher says "no binary for this platform" when it finds none.
[tool.setuptools.package-data]
membrane = ["packs/*.c1f", "packs/*.json", "apps/*.packs", "apps/*/*.c1f", "apps/*/help/*.md", "apps/*/ui/*",
            "help/*.md", "CHANGELOG.md"]
