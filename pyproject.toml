[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babyseat"
version = "0.7.63"
description = "babyseat (formerly membrane): a local-first seat for AI with a memory field (membrane) -- its own web UI (`babyseat`) or inside Home Assistant (HACS)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrii Chechetkin" }]
# the seat is the `cliffvm` binary the wheel carries (native/, Rust); Python is only the launcher (membrane/launcher.py)
dependencies = []

[project.urls]
Homepage = "https://github.com/chedim/membrane"
Issues = "https://github.com/chedim/membrane/issues"

[project.scripts]
membrane = "membrane.launcher:main"
babyseat = "membrane.launcher:main"

[tool.setuptools]
packages = ["membrane"]
# the wheel carries the three launcher files and, from the PREPARED PAYLOAD (setup.py, scripts/dist/build_wheel.sh), the dist folder `membrane/dist/{bin/cliffvm,packs,apps,help,VERSION,MANIFEST.sha256}`;
# nothing else of the repo's membrane/ folder (packs, apps, help, CHANGELOG) is package data: the dist folder is the one copy
include-package-data = false

[tool.pytest.ini_options]
# the Home Assistant component's tests (fake HA, fake seat, a real cliffvm when built: CLIFFVM_BIN) and the wrapper's
testpaths = ["tests/ha", "tests/wrapper"]
