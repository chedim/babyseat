name: census
# The README's rough Blurp badges (until #1096 counts seats once each), from the PyPI downloads that
# pypistats reports with a known OS and without mirrors -- the mirrors and OS-less CI/bot fetches left out.
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count
        run: |
          python3 - <<'PY'
          import datetime as dt, json, urllib.request
          get = lambda u: json.load(urllib.request.urlopen(u, timeout=30))
          rows = [r for r in get("https://pypistats.org/api/packages/babyseat/system")["data"]
                  if r["category"] not in (None, "null")]
          n = sum(r["downloads"] for r in rows)
          badge = lambda label, msg, note: {"schemaVersion": 1, "label": label, "message": msg, "color": "f5a623", "note": note}
          json.dump(badge("🐣 Blurps hatched (est.)", f"{n:,}",
                          "PyPI downloads with a known OS, no mirrors, last 180 days (pypistats)"),
                    open(".github/census/hatched.json", "w"), ensure_ascii=False, indent=1)
          # ALIVE (est.): seats upgrade when a release lands -- the known-OS downloads on the latest
          # release's day and the two days after it (our own release checks included)
          # the newest release whose 3 days pypistats already has (it lags a day)
          pj = get("https://pypi.org/pypi/babyseat/json")
          have = max(dt.date.fromisoformat(r["date"]) for r in rows)
          rels = sorted(((min(dt.date.fromisoformat(f["upload_time"][:10]) for f in fs), v)
                         for v, fs in pj["releases"].items() if fs), reverse=True)
          day0, ver = next((d, v) for d, v in rels if d + dt.timedelta(2) <= have)
          days = {str(day0 + dt.timedelta(d)) for d in range(3)}
          alive = sum(r["downloads"] for r in rows if r["date"] in days)
          json.dump(badge("🐣 Blurps alive (est.)", f"~{alive:,}",
                          f"known-OS PyPI downloads in the 3 days from release {ver} ({day0})"),
                    open(".github/census/alive.json", "w"), ensure_ascii=False, indent=1)
          # the README's badges carry the numbers themselves (static shields badges): no CDN cache between
          import re, urllib.parse
          q = lambda t: urllib.parse.quote(t.replace("-", "--").replace("_", "__"), safe="")
          static = lambda label, msg: f"https://img.shields.io/badge/{q(label)}-{q(msg)}-f5a623"
          r = open("README.md").read()
          r = re.sub(r"\(https://img\.shields\.io/[^)]*(?:hatched|Blurps%20hatched)[^)]*\)", "(" + static("🐣 Blurps hatched (est.)", f"{n:,}") + ")", r, count=1)
          r = re.sub(r"\(https://img\.shields\.io/[^)]*(?:alive|Blurps%20alive)[^)]*\)", "(" + static("🐣 Blurps alive (est.)", f"~{alive:,}") + ")", r, count=1)
          open("README.md", "w").write(r)
          print(n, alive, sorted(days))
          PY
      - name: commit
        run: |
          git config user.name "census-bot"
          git config user.email "census-bot@users.noreply.github.com"
          git add .github/census/ README.md
          git diff --cached --quiet || (git commit -m "census: Blurps hatched (est.)" && git push)
