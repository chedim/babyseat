name: census
# The README's rough Blurp badge (until #1096 counts seats once each): PyPI downloads that pypistats
# reports with a known OS and without mirrors -- the mirrors and the OS-less CI/bot fetches left out.
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = "https://pypistats.org/api/packages/babyseat/system"
          rows = json.load(urllib.request.urlopen(url, timeout=30))["data"]
          n = sum(r["downloads"] for r in rows if r["category"] not in (None, "null"))
          out = {"schemaVersion": 1, "label": "🐣 Blurps hatched (est.)", "message": f"{n:,}", "color": "f5a623",
                 "note": "PyPI downloads with a known OS, no mirrors, last 180 days (pypistats)"}
          json.dump(out, open(".github/census/hatched.json", "w"), ensure_ascii=False, indent=1)
          print(out)
          PY
      - name: commit
        run: |
          git config user.name "census-bot"
          git config user.email "census-bot@users.noreply.github.com"
          git add .github/census/hatched.json
          git diff --cached --quiet || (git commit -m "census: Blurps hatched (est.)" && git push)
