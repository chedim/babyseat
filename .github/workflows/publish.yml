name: publish

# THE OPERATOR'S PUBLISH LINE (#1143, 2026-11-14): nothing here runs by itself. No push, no release event and no schedule starts it: it is a manual dispatch (the operator's `!` line) that names
# the tag to publish AND types a confirmation, and it refuses a tag that is not the package's version. It publishes, in this order:
#   1. PyPI: the platform wheels of `babyseat` (wheels.yml: built from release-binaries.yml's payloads, each smoke-tested), the sdist (carries no binary and fails loudly on a platform without a wheel),
#      and the last `membrane-seat` shim (same version, pins babyseat==version, carries the launcher files so `pip install -U membrane-seat` ends with both commands in place);
#   2. only after PyPI: when `github_release` is ticked, the GitHub release of the tag (notes from membrane/CHANGELOG.md) with the release tarballs and their .sha256 files (what install.sh downloads and checks).
# The Docker image is a separate dispatch (docker.yml). No credentials live in this file: PYPI_TOKEN is the repo secret the operator set (read only by the one upload step).
#   gh workflow run publish.yml --ref v0.7.61 -f tag=v0.7.61 -f confirm="publish v0.7.61" [-f github_release=true]
#   A pre-release (`-f github_release=true -f prerelease=true`) is not GitHub's "latest" release: HACS (which offers the latest release) and /releases/latest keep naming the stable one,
#   while install.sh (newest release, a pre-release included) and docker.yml (by tag) can use it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to publish (e.g. v0.7.61): it must be pyproject.toml's version"
        required: true
      confirm:
        description: 'type exactly: publish <tag>   (e.g. "publish v0.7.61")'
        required: true
      github_release:
        description: "after PyPI, also create the GitHub release of the tag with the release tarballs"
        type: boolean
        default: false
      prerelease:
        description: "make the GitHub release a pre-release: it is not the latest release, so HACS and install.sh's stable channel keep naming the stable one (only with github_release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # the dispatch is the operator's: nothing runs unless the confirmation says the tag
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - id: d
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "publish $TAG" ] || { echo "the confirmation is '$CONFIRM', not 'publish $TAG': nothing published"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # THE TAG IS THE VERSION (2026-10-15): v0.4.2 was released with pyproject.toml still at 0.4.1 -- the lane built 0.4.1 again and PyPI refused it.
      # A tag that is not the package's version stops here.
      - name: the tag is the package's version
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          tag="$TAG"
          # the binaries are built from the commit this run was dispatched on: it must be the tag's (gh workflow run publish.yml --ref <tag> ...)
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "this run is on $GITHUB_SHA, the tag $tag is $(git rev-parse HEAD): dispatch with --ref $tag"; exit 1; }
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "${tag#v}" = "$ver" ] || { echo "tag $tag is not the package version $ver: bump pyproject.toml before releasing"; exit 1; }
          native=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -1)
          [ "$native" = "$ver" ] || { echo "native/Cargo.toml is $native, not $ver: the binary would carry another version than the wheel"; exit 1; }
          # the shim is the same version and pins exactly it (#303)
          shim=$(python -c "import tomllib; print(tomllib.load(open('shim/membrane-seat/pyproject.toml', 'rb'))['project']['version'])")
          [ "$shim" = "$ver" ] || { echo "shim/membrane-seat is $shim, not $ver: bump it with pyproject.toml"; exit 1; }
          deps=$(python -c "import tomllib; print(' '.join(tomllib.load(open('shim/membrane-seat/pyproject.toml', 'rb'))['project']['dependencies']))")
          [ "$deps" = "babyseat==$ver" ] || { echo "the shim depends on '$deps', not babyseat==$ver"; exit 1; }

  # babyseat itself: the platform wheels + the sdist (wheels.yml builds the binaries, packs the wheels, smoke-tests each)
  wheels:
    needs: [detect, check]
    uses: ./.github/workflows/wheels.yml
    with:
      ref: ${{ needs.detect.outputs.tag }}

  # the membrane-seat shim: the same version, pinning babyseat==version, shipping the launcher's three files (never the data) for the RECORD-overlap trick (shim/membrane-seat/pyproject.toml)
  shim:
    needs: [detect, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: |
          mkdir -p dist shim/membrane-seat/membrane
          cp membrane/__init__.py membrane/launcher.py membrane/__main__.py shim/membrane-seat/membrane/
          python -m build shim/membrane-seat --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: shim
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [wheels, shim]
    runs-on: ubuntu-latest
    steps:
      # only the wheels, the sdist and the shim: not the release tarballs (dist-*) or the binary payloads (wheel-payload-*)
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-linux-*,wheel-macos-*,sdist,shim}"
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # PyPI FIRST, then the GitHub release: a HACS user updates from the release and the packages must already be there
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist
          skip-existing: true

  # the GitHub release of the tag (only when asked): notes from the version's CHANGELOG section, and the release tarballs + their .sha256 (install.sh's downloads)
  release:
    needs: [detect, publish]
    if: inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "dist-*"
          path: tarballs
          merge-multiple: true
      - name: notes and title from the CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"]
          text = open("membrane/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r"\b(.*)$", text, re.M)
          if not m:
              raise SystemExit(f"CHANGELOG.md has no '## {tag}' section: add it in the release PR")
          rest = text[m.end():]
          nxt = re.search(r"^## v", rest, re.M)
          body = (rest[:nxt.start()] if nxt else rest).strip() + "\n"
          head = m.group(1)
          name = head.split("—", 1)[1].strip() if "—" in head else ""
          open("notes.md", "w", encoding="utf-8").write(body)
          open("title.txt", "w", encoding="utf-8").write(f"{tag} — {name}" if name else tag)
          PY
      - name: the release with its tarballs
        run: |
          ls -l tarballs
          gh release create "$TAG" tarballs/* --verify-tag --title "$(cat title.txt)" --notes-file notes.md ${{ inputs.prerelease && '--prerelease' || '' }}
