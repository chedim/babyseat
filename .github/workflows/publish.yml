name: publish

# THE PYPI LANE (2026-10-13, the operator set the PYPI_TOKEN repo secret):
# publishing a release's packages was done by hand from the operator's Mac --
# now the lane runs itself: the tag's package builds in CI and uploads with
# the secret, no credentials on any machine or in any checkout. A GitHub
# release going published triggers it; workflow-dispatch covers the catch-up
# case (a version released before the lane existed).
#
# MERGING THE RELEASE PR IS THE RELEASE (operator 2026-11-11): a push to main
# or a release-* patch branch that changes pyproject.toml's version, with no
# tag for that version yet, runs the whole lane: check, wheels, PyPI, then the
# tag + the GitHub release (notes = the version's CHANGELOG section; Zenodo
# archives it) + the Docker image. A push that leaves the version alone, or
# whose version is already tagged, does nothing. Releases and dispatches keep
# working as before (catch-ups, re-runs; PyPI skips what exists).

on:
  push:
    branches: [main, "release-*"]
    paths: [pyproject.toml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to publish (e.g. v0.3.4)"
        required: true

jobs:
  # which tag this run publishes, from what ref, and whether to run at all
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.d.outputs.tag }}
      ref: ${{ steps.d.outputs.ref }}
      go: ${{ steps.d.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            tag="v$ver"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already tagged: nothing to release"; go=false
            else
              echo "a new version on ${{ github.ref_name }}: releasing $tag"; go=true
            fi
            ref="${{ github.sha }}"
          else
            tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
            ref="$tag"; go=true
          fi
          { echo "tag=$tag"; echo "ref=$ref"; echo "go=$go"; } >> "$GITHUB_OUTPUT"

  check:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # THE TAG IS THE VERSION (2026-10-15): v0.4.2 was released with
      # pyproject.toml still at 0.4.1 -- the lane built 0.4.1 again and PyPI
      # refused it. A tag that is not the package's version stops here.
      - name: the tag is the package's version
        run: |
          tag="${{ needs.detect.outputs.tag }}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "${tag#v}" = "$ver" ] || { echo "tag $tag is not the package version $ver: bump pyproject.toml before releasing"; exit 1; }
          # the shim is the same version and pins exactly it (#303); a tag cut
          # before the shim existed (a catch-up dispatch) has none to check
          if [ -f shim/membrane-seat/pyproject.toml ]; then
            shim=$(python -c "import tomllib; print(tomllib.load(open('shim/membrane-seat/pyproject.toml', 'rb'))['project']['version'])")
            [ "$shim" = "$ver" ] || { echo "shim/membrane-seat is $shim, not $ver: bump it with pyproject.toml"; exit 1; }
            deps=$(python -c "import tomllib; print(' '.join(tomllib.load(open('shim/membrane-seat/pyproject.toml', 'rb'))['project']['dependencies']))")
            [ "$deps" = "babyseat==$ver" ] || { echo "the shim depends on '$deps', not babyseat==$ver"; exit 1; }
          fi

  # babyseat itself: one compiled wheel per platform (the field engine inside) + the sdist (wheels.yml)
  wheels:
    needs: [detect, check]
    uses: ./.github/workflows/wheels.yml
    with:
      ref: ${{ needs.detect.outputs.ref }}

  # the membrane-seat shim, while shim/ carries it (delete the directory to stop publishing it). It ships the same
  # module as babyseat (see shim/membrane-seat/pyproject.toml for why), copied in here; it pins babyseat==version,
  # whose wheel carries the compiled engine
  shim:
    needs: [detect, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: |
          mkdir -p dist
          if [ -d shim/membrane-seat ]; then
            cp -R membrane shim/membrane-seat/membrane
            python -m build shim/membrane-seat --outdir dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shim
          path: dist/*
          if-no-files-found: ignore

  publish:
    needs: [wheels, shim]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # PyPI FIRST, then the GitHub release (2026-10-15): HACS users update
      # from the release, and their HA then pip-installs the pinned seat --
      # the package must already be there. The release re-runs this lane on
      # an upload that exists; skip it (the tag check above still guards).
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist
          skip-existing: true

  # MERGE = RELEASE (2026-11-11): after PyPI, tag the merged commit and publish the GitHub release from the version's
  # CHANGELOG section. A release made with the workflow token starts no other workflow, so the Docker image is
  # dispatched explicitly (a dispatch does start one). A patch line (release-*) is never marked latest.
  release:
    needs: [detect, publish]
    if: github.event_name == 'push' && needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }}
      - name: notes and title from the CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"]
          text = open("membrane/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r"\b(.*)$", text, re.M)
          if not m:
              raise SystemExit(f"CHANGELOG.md has no '## {tag}' section: add it in the release PR")
          rest = text[m.end():]
          nxt = re.search(r"^## v", rest, re.M)
          body = (rest[:nxt.start()] if nxt else rest).strip() + "\n"
          head = m.group(1)
          name = head.split("\u2014", 1)[1].strip() if "\u2014" in head else ""
          open("notes.md", "w", encoding="utf-8").write(body)
          open("title.txt", "w", encoding="utf-8").write(f"{tag} \u2014 {name}" if name else tag)
          PY
      - name: tag + GitHub release
        run: |
          latest=true
          case "${{ github.ref_name }}" in release-*) latest=false ;; esac
          gh release create "$TAG" --target "${{ needs.detect.outputs.ref }}" --title "$(cat title.txt)" \
            --notes-file notes.md --latest="$latest"
      - name: the Docker image
        run: gh workflow run docker.yml -f tag="$TAG"
