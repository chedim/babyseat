name: validate

on:
  push:
  pull_request:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: the integration is not in home-assistant/brands yet (it is
          # not published); the check re-arms when it is. license: the private
          # use license is a LicenseRef custom license (no SPDX id) -- HACS's
          # repository license check reads that as NOASSERTION and refuses.
          # SPACE separated (the action splits INPUT_IGNORE on " ", not on
          # ","); every other check (hassfest, validate) runs.
          ignore: brands license
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # couchbase: the optional extra -- the fakes-based efstore tests import its
      # exception classes (the CI exhibit: ModuleNotFoundError 'couchbase');
      # there is no cluster in CI, the FakeCluster stands in for one.
      - run: pip install -e ".[couchbase]" pytest aiohttp
      # The seat's suite (tests/) -- live-lane tests skip themselves when the
      # runner has no ollama.
      - run: pytest -q -p no:cacheprovider --deselect tests/test_thinking_indicator.py
      # The integration's suite is its own tree with its own stub-conftest
      # (a fake HA + aiohttp) -- run in its own process, never together with
      # the seat's.
      - run: pytest -q -p no:cacheprovider integrations/homeassistant/tests
