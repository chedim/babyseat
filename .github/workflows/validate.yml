name: validate

on:
  push:
  pull_request:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # every check runs, as the HACS default list requires (2026-11-10): the license is MIT (GitHub detects it)
          # and the integration ships its own brand/ icon (#1081)
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  # The seat's pack-tied tests (seat-tests/): they run on the pinned cliffvm release (CLIFFVM_VERSION), as a library at that version and as the downloaded program (CLIFFVM_DIST).
  seat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # the tests use a system python3 as a fake `claude` and an http.server
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seat-tests
      - uses: taiki-e/install-action@nextest
      - run: scripts/dist/fetch_cliffvm.sh "$(cat CLIFFVM_VERSION)" ${{ matrix.target }} "$RUNNER_TEMP/cliffvm"
      - run: cargo nextest run --release --no-fail-fast
        working-directory: seat-tests
        env:
          CLIFFVM_DIST: ${{ runner.temp }}/cliffvm
  js:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]   # the page tests split over three runners: each file runs in one of them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5   # the page tests serve the repo with `python3 -m http.server` and use a fake `claude`
        with:
          python-version: "3.13"
      - run: scripts/dist/fetch_cliffvm.sh "$(cat CLIFFVM_VERSION)" x86_64-unknown-linux-gnu "$RUNNER_TEMP/cliffvm"   # the engine is the pinned cliffvm release (CLIFFVM_VERSION)
      # headless Chrome is on the runner image; every page test starts it itself
      - run: |
          set -e
          export CLIFFVM="$RUNNER_TEMP/cliffvm/bin/cliffvm" CHROME="$(command -v google-chrome)"
          # the first start of Chrome on a fresh runner is slow (more than the 10 s some page tests wait for its debugging port): start it once here, before any test
          "$CHROME" --headless=new --no-first-run --no-default-browser-check --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null 2>&1 || true
          i=0
          for t in tests/js/*.test.mjs; do
            if [ $((i % 3)) -eq ${{ matrix.shard }} ]; then echo "== $t"; node "$t"; fi
            i=$((i + 1))
          done
  ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: scripts/dist/fetch_cliffvm.sh "$(cat CLIFFVM_VERSION)" x86_64-unknown-linux-gnu "$RUNNER_TEMP/cliffvm"
      - run: pip install pytest aiohttp
      - run: CLIFFVM_BIN="$RUNNER_TEMP/cliffvm/bin/cliffvm" pytest -q -p no:cacheprovider tests/ha
  # the browser VM is committed as a build output: it must be the build of the Rust source in this tree
  # a WARNING, not a gate (operator 2026-11-15): the same source builds to different bytes on a Mac and on this runner (the toolchains differ: Rust stable, wasm-pack and wasm-bindgen move), so the committed
  # wasm can never match the runner's build until the toolchain is pinned; the page's JS tests (the js job) are what prove the committed engine works
  wasm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: sh scripts/build_wasm.sh
      - run: git diff --exit-code -- membrane/apps/barest.c1f/ui/ || echo "::warning title=wasm differs::this runner's build of the wasm differs from the committed one (the toolchains differ); the js job tests the committed engine"
  # the Python wrapper (membrane/launcher.py) and the pins on versions, licence and names
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest build setuptools
      # the packaging scripts and the installer: parse-clean and shellcheck-clean
      - run: shellcheck -S warning install.sh scripts/dist/*.sh docker/docker-entrypoint.sh
      # the wrapper's tests: the launcher, the versions, the wheel (built from a fake payload), install.sh (a file:// release), the Dockerfile and the workflows
      - run: pytest -q -p no:cacheprovider tests/wrapper
