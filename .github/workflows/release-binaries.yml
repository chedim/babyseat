name: release-binaries

# THE RELEASE BINARY AND ITS DIST FOLDER (#1143, docs/packaging-plan.md, decided 2026-11-14): `cliffvm` for each platform (NOT built here since the engine moved to github.com/chedim/cliffvm: the release named by
# the file CLIFFVM_VERSION is downloaded and checked, scripts/dist/fetch_cliffvm.sh) assembled with the packs, the barest app and
# the page into dist/<version>/ (scripts/dist/build.sh), smoke-tested from that folder alone (scripts/dist/smoke.sh: --version, `serve --port 0`, /global/health with the admin
# token), and uploaded as workflow artifacts: the tar.gz of the dist folder, and the wheel payload (scripts/dist/assemble_wheel_payload.sh) the wheel wrapper packages.
# It PUBLISHES NOTHING: no PyPI, no GitHub release, no Docker push (publishing is the operator's `!` line). Runs on a tag `v*` and by hand only.
#
# Platforms: macOS arm64 and x86_64 (the x86_64 one is cross-built on Apple silicon and smoke-tested under Rosetta), Linux x86_64 and aarch64 on glibc (built inside manylinux_2_28
# containers so the glibc floor is 2.28, as the wheels of 0.7.5x were) and on musl (static, for Alpine / Home Assistant's container). Windows: none (the plan). Android/Termux: none.
#
# NOT here (a decision, listed in the packaging round's report): the wasm drift check. `scripts/build_wasm.sh` rewrites the committed browser wasm and its version hash; a job would run it
# (rust wasm32-unknown-unknown + wasm-pack) and fail on `git diff --exit-code` on the files it writes (see scripts/build_wasm.sh; they live in the barest app's ui/ folder).
# Whether the wasm build is byte-reproducible across machines is UNVERIFIED, so it is not switched on.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:        # wheels.yml (the wheels are built from this run's wheel-payload-<target> artifacts) and so publish.yml

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,         os: macos-latest,       target: aarch64-apple-darwin,       smoke: "" }
          - { name: macos-x86_64,        os: macos-latest,       target: x86_64-apple-darwin,        smoke: "arch -x86_64", rosetta: true }
          - { name: linux-x86_64,        os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu,   smoke: "" }
          - { name: linux-aarch64,       os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, smoke: "" }
          - { name: linux-musl-x86_64,   os: ubuntu-22.04,    target: x86_64-unknown-linux-musl,  smoke: "" }
          - { name: linux-musl-aarch64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, smoke: "" }
    steps:
      - uses: actions/checkout@v4

      - name: the version, and the tag it must match
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          [ -n "$VER" ] || { echo "no version in pyproject.toml"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ENGINE=$(cat CLIFFVM_VERSION)" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$VER (pyproject.toml)"; exit 1
          fi

      - name: "Rosetta (to run the x86_64 binary on Apple silicon; the download is retried because it fails now and then)"
        if: matrix.rosetta
        run: |
          for i in 1 2 3 4; do
            sudo softwareupdate --install-rosetta --agree-to-license && exit 0
            echo "Rosetta install failed (attempt $i)"; sleep 20
          done
          exit 1

      - name: the engine, from the cliffvm release (checksum and manifest checked)
        run: sh scripts/dist/fetch_cliffvm.sh "$ENGINE" "${{ matrix.target }}" "engine/${{ matrix.target }}"

      - name: build the dist folder (the engine binary + packs + apps + manifest)
        run: sh scripts/dist/build.sh --bin "engine/${{ matrix.target }}/bin/cliffvm" --engine-version "$ENGINE" --archive "dist/babyseat-$VER-${{ matrix.target }}.tar.gz"

      - name: "what the binary needs (information)"
        run: |
          file "dist/$VER/bin/cliffvm" || true
          if [ "$(uname)" = Linux ]; then
            (ldd "dist/$VER/bin/cliffvm" || true)
            objdump -T "dist/$VER/bin/cliffvm" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true
          else
            otool -l "dist/$VER/bin/cliffvm" | grep -A3 LC_BUILD_VERSION || true
          fi

      - name: "smoke test (the folder alone, --version, serve --port 0, /global/health with the admin token)"
        run: ${{ matrix.smoke }} sh scripts/dist/smoke.sh "dist/$VER"

      - name: the wheel payload (the dist folder the wrapper packages as membrane/dist/)
        run: sh scripts/dist/assemble_wheel_payload.sh "dist/$VER" "payload/${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          # the tarball and its .sha256 (install.sh checks the download against it before extracting)
          path: |
            dist/babyseat-${{ env.VER }}-${{ matrix.target }}.tar.gz
            dist/babyseat-${{ env.VER }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-payload-${{ matrix.target }}
          path: payload/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
