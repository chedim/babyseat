name: wheels

# THE FIELD ENGINE SHIPS COMPILED (0.7.5, the operator: "don't make users build half the project"): babyseat's
# native engine (native/, Rust + PyO3) is built into one wheel per platform with PyO3's stable ABI, so each wheel
# serves every Python >= 3.10. macOS (arm64, Intel) and Linux (x86_64, aarch64); anything else builds from the sdist
# (install.sh fetches a Rust toolchain when it is missing). Each wheel is installed into a clean environment and must
# import the engine before it can be published. publish.yml calls this workflow; a PR that touches the engine or the
# build runs it too, so a broken wheel never reaches a release.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "native/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
          - { name: macos-arm64, os: macos-latest, archs: arm64 }
          - { name: macos-x86_64, os: macos-latest, archs: x86_64 }      # cross-built on Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp310-*"                     # abi3: the one cp310 build serves every newer Python
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_MACOS: "rustup target add x86_64-apple-darwin aarch64-apple-darwin"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          # the wheel alone, in a clean environment: the engine must import (no dependencies needed for it)
          CIBW_TEST_COMMAND: >-
            python -c "from membrane import membrane_vm as m; assert m.evaluate('1 + 1', '{}') == '2'; print('engine ok')"
          CIBW_TEST_SKIP: "*-macosx_x86_64"          # cross-built: no Intel CPU to run it on
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
