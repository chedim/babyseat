name: docker

# THE IMAGE LANE (#202): a published release builds the public image
# chedim/membrane for amd64 + arm64 and pushes X.Y.Z, X.Y and latest.
# It builds from a CLEAN checkout of the release tag (never a dev tree),
# and the allowlist .dockerignore sends only the package. A pull request
# that touches the Docker files gets a build-only run: smoke + privacy check.
#
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access
# token with write access to chedim/membrane).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to build and push (e.g. v0.6.1)"
        required: true
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - "docker/**"
      - .github/workflows/docker.yml
      - pyproject.toml

env:
  IMAGE: chedim/membrane

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: membrane:ci
      - name: smoke (the CLI runs without booting a seat)
        run: docker run --rm --entrypoint membrane membrane:ci --help
      - name: smoke (the entrypoint passes non-seat commands through)
        run: docker run --rm membrane:ci --help
      - name: privacy (no runtime state in the image)
        run: |
          found=$(docker run --rm --entrypoint sh membrane:ci -c \
            'find / -xdev \( -name ".membrane" -o -name "*.jsonl" -o -name "field*.json" -o -name "serve-auth.json" \) -not -path "*/site-packages/*" 2>/dev/null' || true)
          if [ -n "$found" ]; then
            echo "runtime state found in the image:"; echo "$found"; exit 1
          fi
          echo "clean"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # THE TAG IS THE VERSION (mirrors publish.yml): an image tagged with a
      # version the package doesn't carry stops here.
      - name: the tag is the package's version
        id: ver
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "${tag#v}" = "$ver" ] || { echo "tag $tag is not the package version $ver: bump pyproject.toml before releasing"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      # THE SOURCE IS THE TAG, THE RECIPE IS THIS COMMIT: a dispatch of a
      # tag cut before the image existed (v0.6.1) has no Dockerfile in its
      # tree, so the build recipe (Dockerfile, .dockerignore, docker/) comes
      # from the workflow's own commit and is laid over the tag's checkout.
      # On a release event both are the same commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _recipe
          sparse-checkout: |
            Dockerfile
            .dockerignore
            docker/
          sparse-checkout-cone-mode: false
      - name: lay the recipe over the tag's source
        run: |
          cp _recipe/Dockerfile _recipe/.dockerignore .
          rm -rf docker && cp -R _recipe/docker docker
          rm -rf _recipe
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
